# Local development: everything Agora needs, behind one front door at
# http://agora.localhost:3000 (browsers resolve *.localhost to this machine).
#
#   make dev        build and start everything
#   make dev-down   stop, keeping data
name: agora

x-python: &python
  build:
    context: .
    dockerfile: python/Dockerfile
  image: agora-python:dev
  env_file:
    - path: .env.compose
      required: false
  environment: &python-env
    AGORA_ENVIRONMENT: local
    AGORA_GIT_COMMIT: ${AGORA_GIT_COMMIT:-unknown}
    AGORA_PUBLIC_URL: http://agora.localhost:3000
    AGORA_DATABASE_URL: postgresql://agora:agora@postgres:5432/agora
    AGORA_SPACES_ENDPOINT: http://s3:8333
    AGORA_SPACES_PUBLIC_ENDPOINT: http://localhost:8333
    AGORA_SPACES_REGION: syd1
    AGORA_SPACES_BUCKET: agora-logs
    AGORA_SPACES_KEY: agora
    AGORA_SPACES_SECRET: agora-secret
    AGORA_OIDC_METADATA_URL: http://agora.localhost:3000/agora/.well-known/openid-configuration
    AGORA_OIDC_CLIENT_ID: agora-local
    AGORA_OIDC_CLIENT_SECRET: agora-local-secret
    AGORA_BOOTSTRAP_ADMINS: admin@example.test
    AGORA_SESSION_SECRET: local-only-session-secret-change-me
    # The development model needs no provider key. To use real models, set
    # AGORA_MODELS_FILE=/app/config/models.yaml and ANTHROPIC_API_KEY in .env.compose.
    AGORA_MODELS_FILE: ${AGORA_MODELS_FILE:-/app/config/models.dev.yaml}
    # The local worker takes every queue, witness included, with the lexicon reader.
    AGORA_WITNESS_FILE: ${AGORA_WITNESS_FILE:-/app/config/witness.dev.yaml}
  depends_on:
    postgres:
      condition: service_healthy
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agora"]
      interval: 2s
      retries: 30

  # MinIO's community images are retired (see docs/DECISIONS.md); SeaweedFS
  # serves the S3 API locally instead. With no identities configured it accepts
  # any credentials.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./infra/dev/mock-oidc.json:/config/mock-oidc.json:ro

  migrate:
    <<: *python
    command: ["sh", "-c", "python -m agora_worker.cli ensure-bucket && python -m agora_worker.cli migrate"]
    restart: "no"

  api:
    <<: *python
    command: ["uvicorn", "agora_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *python
    command: ["procrastinate", "--app=agora_worker.app.app", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: agora-web:dev
    environment:
      AGORA_API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  front:
    image: caddy:2.11.7
    ports:
      - "3000:3000"
    volumes:
      - ./infra/dev/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - agora.localhost
    depends_on:
      - web
      - api
      - mock-oidc

volumes:
  pgdata:
  s3data:
