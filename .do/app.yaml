# DigitalOcean App Platform spec for Agora. Deploys on every push to main.
#
# Agora runs in the existing app bupa-ai-poc, which keeps its name and address.
# A lean prototype: App Platform's dev database holds everything, files included,
# so there is no managed cluster or Spaces bucket to pay for. docs/RUNBOOK.md says
# how to move to a managed cluster and Spaces later.
# Validate without a token:   make spec   (doctl apps spec validate --schema-only)
# Apply changes:              doctl apps update <app-id> --spec .do/app.yaml
#
# Secrets (type: SECRET) carry no value here. Set them once in the control panel;
# App Platform encrypts them. To keep them across `doctl apps update`, copy the
# encrypted EV[...] values from `doctl apps spec get <app-id>` into this file.
# Never commit a plaintext secret. See docs/RUNBOOK.md.
name: bupa-ai-poc
# Sydney: App Platform region syd, with Postgres and Spaces in syd1.
region: syd
# Server-sent events must not be buffered or cached at the edge.
disable_edge_cache: true
disable_email_obfuscation: true
features:
  - buildpack-stack=ubuntu-22

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

envs:
  - key: AGORA_ENVIRONMENT
    value: production
    scope: RUN_TIME
  - key: AGORA_PUBLIC_URL
    value: ${APP_URL}
    scope: RUN_TIME
  # Inspect logs and the judges' raw answers are kept in Postgres.
  - key: AGORA_STORAGE
    value: database
    scope: RUN_TIME
  # The dev database allows few connections, so each process keeps a small pool:
  # at most 5 for SQLAlchemy and 2 for the queue, in the API and the worker alike.
  - key: AGORA_DATABASE_POOL_SIZE
    value: "3"
    scope: RUN_TIME
  - key: AGORA_DATABASE_MAX_OVERFLOW
    value: "2"
    scope: RUN_TIME
  - key: AGORA_QUEUE_POOL_SIZE
    value: "2"
    scope: RUN_TIME
  # Only App Platform's load balancer can reach the API, so Uvicorn may trust
  # its X-Forwarded-* headers.
  - key: FORWARDED_ALLOW_IPS
    value: "*"
    scope: RUN_TIME

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: web
    github:
      repo: andrewbupa/agora
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: web/Dockerfile
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /healthz
    envs:
      - key: AGORA_API_INTERNAL_URL
        value: ${api.PRIVATE_URL}
        scope: RUN_TIME

  - name: api
    github:
      repo: andrewbupa/agora
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: python/Dockerfile
    run_command: uvicorn agora_api.main:app --host 0.0.0.0 --port 8000
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health/ready
    liveness_health_check:
      http_path: /api/health
    termination:
      drain_seconds: 30
      grace_period_seconds: 100
    envs: &python_envs
      - key: AGORA_GIT_COMMIT
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
      - key: AGORA_DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: AGORA_DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: AGORA_OIDC_METADATA_URL
        value: https://login.example.invalid/.well-known/openid-configuration
        scope: RUN_TIME
      - key: AGORA_OIDC_CLIENT_ID
        value: set-me
        scope: RUN_TIME
      - key: AGORA_OIDC_CLIENT_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: AGORA_OIDC_ROLE_MAP
        value: ""
        scope: RUN_TIME
      - key: AGORA_BOOTSTRAP_ADMINS
        value: ""
        scope: RUN_TIME
      - key: AGORA_SESSION_SECRET
        type: SECRET
        scope: RUN_TIME
      # Provider keys, read by Inspect. Add one per provider in config/models.yaml.
      - key: ANTHROPIC_API_KEY
        type: SECRET
        scope: RUN_TIME
      # The Ethos panel's second family (judge_b).
      - key: OPENAI_API_KEY
        type: SECRET
        scope: RUN_TIME

workers:
  - name: worker
    github:
      repo: andrewbupa/agora
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: python/Dockerfile
    # Sandbox and witness jobs are left for the Droplet runner (infra/runner).
    run_command: procrastinate --app=agora_worker.app.app worker --queues default,runs
    # Raise to apps-s-1vcpu-2gb if audits restart it for want of memory.
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    # Jobs get 100 s to finish after SIGTERM (agora_core.queue.WORKER_DEFAULTS).
    termination:
      grace_period_seconds: 120
    envs: *python_envs

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: andrewbupa/agora
      branch: main
    source_dir: /
    dockerfile_path: python/Dockerfile
    # Applies migrations, then loads agents/ from git into Postgres.
    run_command: python -m agora_worker.cli migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs: *python_envs

# A dev database, made with the app: no cluster to create by hand. It has no
# automatic backups. Agora needs Postgres 13 or later; App Platform picks the
# version. For a managed cluster instead, set production: true, cluster_name,
# db_name and db_user (docs/RUNBOOK.md).
databases:
  - name: db
    engine: PG
    production: false
