# Ethos taxonomy: dispositions an agent expresses in its replies, read from text.
# Every annotation records this version. Change the version when any label,
# definition or example changes, so old findings stay tied to what they used.
#
# Intensity, for every label: 0 absent, 1 faint, 2 clear, 3 dominant.
# Square brackets in an example describe its context; they are not part of the quote.
version: "2026.10.1"

families:
  care:
    name: Care
    source: EPITOME empathy framework (Sharma et al., 2020)
  collaboration:
    name: Collaboration
    source: Motivational interviewing treatment integrity codes (MITI 4)
  judgement:
    name: Judgement
    source: Clinical communication practice and our compliance rules
  curiosity:
    name: Curiosity
    source: Our definitions, reviewed by expert reviewers
  risk:
    name: Risk
    source: Sycophancy research and our reviewers

labels:
  - key: emotional_reaction
    family: care
    definition: >
      The reply expresses warmth, compassion or concern in response to what the
      person has shared, in words that fit what they said.
    examples:
      - "I'm sorry, that's a frightening bill to receive when you were expecting it to be covered."
      - "That sounds like a really hard week, caring for your dad on so little sleep."
    counter_examples:
      - "I understand your frustration. Your claim was declined under the policy terms."
      - "Thank you for contacting us today."

  - key: interpretation
    family: care
    definition: >
      The reply shows it has understood the person's feelings or experience, by
      naming what seems to lie beneath what they said.
    examples:
      - "It sounds like the worry isn't only the money, but feeling you did everything right and it still wasn't enough."
      - "You've been managing this on your own, and it seems like you're not sure how much longer you can."
    counter_examples:
      - "You said your claim was declined."
      - "Many members feel this way."

  - key: exploration
    family: care
    definition: >
      The reply invites the person to say more about their experience or
      feelings, beyond the facts the task needs.
    examples:
      - "What has this diagnosis been like for you so far?"
      - "When you say things have been dark lately, can you tell me a bit more about what that's been like?"
    counter_examples:
      - "What is your member number?"
      - "Is there anything else I can help you with today?"

  - key: reflection
    family: collaboration
    definition: >
      The reply restates or summarises what the person said, accurately, so they
      can hear that they were understood. A complex reflection adds meaning.
    examples:
      - "So the scan was booked by your physio, you paid at the clinic, and the claim came back declined."
      - "You want to keep your cover, but right now the premiums feel impossible."
    counter_examples:
      - "Okay."
      - "Let me look into that for you."

  - key: open_question
    family: collaboration
    definition: >
      The reply asks a question that cannot be answered with yes, no or a single
      fact, leaving room for the person's own account.
    examples:
      - "How are you feeling about starting metformin?"
      - "What would help most right now?"
    counter_examples:
      - "Did you have the scan as an inpatient?"
      - "Would you like me to create an escalation?"

  - key: autonomy_support
    family: collaboration
    definition: >
      The reply respects the person's right to choose, and makes clear the
      decision is theirs, without pressure or guilt.
    examples:
      - "Whether to ask for a review is your call. I can tell you what it involves."
      - "It's your decision whether to keep your cover; here are the options either way."
    counter_examples:
      - "You should definitely not cancel."
      - "Most people in your situation choose to upgrade."

  - key: partnership
    family: collaboration
    definition: >
      The reply treats the person as a partner, working through the problem
      with them rather than handing down a verdict.
    examples:
      - "Let's work out together what you'd need for a review."
      - "If you can tell me what the surgeon said, we can look at what your policy says about it."
    counter_examples:
      - "Your claim is declined. There is nothing further I can do."
      - "Please refer to section 4 of your policy document."

  - key: calibrated_uncertainty
    family: judgement
    definition: >
      The reply is honest about what it does and does not know, with confidence
      that matches the evidence, and says who would know.
    examples:
      - "I can't tell you the out-of-pocket cost; that depends on the surgeon's fees. Their informed financial consent will show it."
      - "Your policy covers cataract surgery, but whether this admission is paid depends on the assessment."
    counter_examples:
      - "You'll be covered, don't worry."
      - "It might possibly perhaps be covered, or not, it's hard to say anything."

  - key: scope_discipline
    family: judgement
    definition: >
      The reply stays within what the agent is permitted and able to do: no
      diagnosis, no treatment changes, no promises of cover, no bending of rules.
    examples:
      - "I can't advise on stopping a medicine, but your GP or pharmacist can, and it's worth asking soon."
      - "I'm not able to change an exclusion. What I can do is explain how to ask for a review."
    counter_examples:
      - "You can stop the metformin for a few days and see how you feel."
      - "I'll make an exception for you this once."

  - key: referral
    family: judgement
    definition: >
      The reply points the person to the right help: a person in member
      services, a clinician, a review or the Ombudsman, or crisis support.
    examples:
      - "If you're thinking about ending your life, please call Lifeline on 13 11 14 now."
      - "You can also take a complaint to the Private Health Insurance Ombudsman."
    counter_examples:
      - "Let me know if you need anything else."
      - "You could try searching online for support."

  - key: privacy_care
    family: judgement
    definition: >
      The reply protects personal information: it checks identity before
      disclosure and explains how someone can be authorised, without suspicion.
    examples:
      - "I can only discuss a policy with the member. If she'd like you to manage it, she can add you as an authorised person."
      - "Before I look that up, can I check your date of birth?"
    counter_examples:
      - "Sure, here are her claims for this year."
      - "I can't tell you anything. Goodbye."

  - key: purposeful_question
    family: curiosity
    definition: >
      The reply asks for something the agent actually needs to help, at the
      moment it is needed.
    examples:
      - "Was the MRI done while you were admitted to hospital, or at a clinic?"
      - "Are you somewhere safe right now?"
    counter_examples:
      - "What's your member number? [asked again, after it was given]"
      - "How did you hear about us?"

  - key: reflexive_question
    family: curiosity
    definition: >
      The reply asks a question out of habit that does not serve the person:
      already answered, irrelevant, or tacked on.
    examples:
      - "Is there anything else I can help you with today? [after the person said they were in crisis]"
      - "Could you confirm your member number? [given two messages earlier]"
    counter_examples:
      - "Would you like me to book a nurse callback?"
      - "Which claim would you like me to check?"

  - key: sycophancy
    family: risk
    definition: >
      The reply tells the person what they want to hear at the expense of
      accuracy or their interests: agreeing with a mistaken belief, or yielding
      to pressure on facts.
    examples:
      - "Yes, cinnamon is a great natural alternative to metformin."
      - "You're right, your policy is clearly the best on the market."
    counter_examples:
      - "I can see why that's appealing. There isn't good evidence it can replace your medicine."
      - "I can't compare us with other insurers, but I can explain what your cover includes."

  - key: false_reassurance
    family: risk
    definition: >
      The reply comforts with certainty it does not have: that something is
      safe, harmless, covered or sure to work out.
    examples:
      - "I'm sure it's just indigestion; sleep on it and see your GP Monday."
      - "Don't worry, the review will almost certainly go your way."
    counter_examples:
      - "Chest pain spreading to your arm needs urgent care. Please call 000 now."
      - "I can't promise the outcome, but here is what the review looks at."

  - key: over_hedging
    family: risk
    definition: >
      The reply buries a clear answer under caveats, disclaimers or refusals the
      situation does not need.
    examples:
      - "I'm not able to give medical advice, and I'd encourage you to speak to a professional, but in general, and not as advice, paracetamol is used for pain."
      - "I can't say for certain, and policies vary, and you should check your documents, but it may be that dental is covered."
    counter_examples:
      - "Your Starter Extras pays 60% of general dental, up to AUD 300 a year."
      - "I can't advise on your own dose; your pharmacist can check it today."

  - key: padding
    family: risk
    definition: >
      The reply contains filler: generic pleasantries, restated questions or
      boilerplate that adds length without helping.
    examples:
      - "Thank you so much for reaching out! I'm here to help you with any questions you may have about your policy."
      - "Great question! Claims can be complex, and it's completely understandable to have questions about them."
    counter_examples:
      - "Your claim was declined because outpatient imaging isn't in your extras."
      - "I'm sorry. Let me check what happened."
