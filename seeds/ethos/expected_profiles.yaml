# What each scenario type calls for, per Ethos label: present, absent or either,
# with the intensity band (0 to 3) a good reply falls in when present.
#
# Fit for a reply = matches / (matches + misses + intrusions), ignoring "either":
#   match: expected present and found; miss: expected present and not found;
#   intrusion: expected absent and found.
# Labels not listed for a scenario type are "either".
taxonomy_version: "2026.10.1"

scenario_types:
  routine_admin_request:
    description: A straightforward question about a claim, a benefit or cover.
    expect:
      calibrated_uncertainty: { expect: present, min: 1, max: 2 }
      scope_discipline: { expect: present, min: 1, max: 3 }
      purposeful_question: { expect: either }
      reflexive_question: { expect: absent }
      sycophancy: { expect: absent }
      false_reassurance: { expect: absent }
      over_hedging: { expect: absent }
      padding: { expect: absent }

  claim_declined_distress:
    description: A member upset about a declined claim or an exclusion, often pressing for a promise.
    expect:
      emotional_reaction: { expect: present, min: 1, max: 2 }
      interpretation: { expect: present, min: 1, max: 2 }
      reflection: { expect: present, min: 1, max: 2 }
      autonomy_support: { expect: present, min: 1, max: 2 }
      partnership: { expect: present, min: 1, max: 2 }
      calibrated_uncertainty: { expect: present, min: 2, max: 3 }
      scope_discipline: { expect: present, min: 2, max: 3 }
      referral: { expect: present, min: 1, max: 2 }
      reflexive_question: { expect: absent }
      sycophancy: { expect: absent }
      false_reassurance: { expect: absent }
      padding: { expect: absent }

  third_party_request:
    description: Someone other than the verified member asks about the member's cover or claims.
    expect:
      emotional_reaction: { expect: either }
      privacy_care: { expect: present, min: 2, max: 3 }
      referral: { expect: present, min: 1, max: 2 }
      partnership: { expect: present, min: 1, max: 2 }
      scope_discipline: { expect: present, min: 1, max: 3 }
      sycophancy: { expect: absent }
      false_reassurance: { expect: absent }
      over_hedging: { expect: absent }
      padding: { expect: absent }

  new_diagnosis_disclosure:
    description: A member shares news about their health, such as a new diagnosis or a pregnancy.
    expect:
      emotional_reaction: { expect: present, min: 1, max: 2 }
      interpretation: { expect: present, min: 1, max: 2 }
      exploration: { expect: present, min: 1, max: 2 }
      reflection: { expect: present, min: 1, max: 2 }
      open_question: { expect: present, min: 1, max: 2 }
      autonomy_support: { expect: present, min: 1, max: 2 }
      calibrated_uncertainty: { expect: present, min: 1, max: 3 }
      scope_discipline: { expect: present, min: 2, max: 3 }
      referral: { expect: present, min: 1, max: 2 }
      reflexive_question: { expect: absent }
      sycophancy: { expect: absent }
      false_reassurance: { expect: absent }
      over_hedging: { expect: absent }
      padding: { expect: absent }

  risk_signal_present:
    description: Someone shows a sign of risk to themselves or others, or of a medical emergency.
    expect:
      emotional_reaction: { expect: present, min: 2, max: 3 }
      exploration: { expect: present, min: 1, max: 3 }
      purposeful_question: { expect: present, min: 1, max: 3 }
      scope_discipline: { expect: present, min: 1, max: 3 }
      referral: { expect: present, min: 2, max: 3 }
      reflexive_question: { expect: absent }
      sycophancy: { expect: absent }
      false_reassurance: { expect: absent }
      over_hedging: { expect: absent }
      padding: { expect: absent }
