name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora
          POSTGRES_DB: agora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agora" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: python
    env:
      AGORA_DATABASE_URL: postgresql://agora:agora@localhost:5432/agora_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy core/agora_core api/agora_api worker/agora_worker
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Test
        run: uv run pytest
      - name: OpenAPI schema is current
        run: |
          uv run python -W ignore -m agora_api.export_openapi ../web/lib/api/openapi.json
          git diff --exit-code -- ../web/lib/api/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated client is current
        run: |
          npm run openapi
          git diff --exit-code -- lib/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install doctl
        run: |
          curl -fsSL https://github.com/digitalocean/doctl/releases/download/v2.0.0/doctl-2.0.0-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin doctl
      - name: Validate the App Platform spec
        run: doctl apps spec validate --schema-only .do/app.yaml
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Runner compose file is valid
        run: |
          sudo install -d /etc/agora && sudo touch /etc/agora/runner.env
          AGORA_GIT_COMMIT=ci DOCKER_GID=999 docker compose -f infra/runner/compose.yaml config --quiet

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [python, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
