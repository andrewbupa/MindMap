# Model roles for local development without provider keys. Point AGORA_MODELS_FILE
# here to use Agora's deterministic development model. Never use in production.
roles:
  target:
    model: agoradev/scripted
    generate: { reasoning_effort: medium, max_tokens: 4000 }
  auditor:
    model: agoradev/scripted
  judge_a:
    model: agoradev/scripted
  # A second development "family", so the Ethos panel rules hold locally too.
  judge_b:
    model: agorapeer/scripted
  scenarios:
    model: agoradev/scripted
panels:
  ethos: [judge_a, judge_b]
budgets:
  rehearsal: 400000

# The development models run inside Agora; nothing is sent to a provider.
providers:
  agoradev:
    name: Agora development model
    retention: Runs inside Agora. Nothing leaves our infrastructure.
    zero_data_retention: Not applicable.
    sends_content: false
  agorapeer:
    name: Agora development model (second family)
    retention: Runs inside Agora. Nothing leaves our infrastructure.
    zero_data_retention: Not applicable.
    sends_content: false
