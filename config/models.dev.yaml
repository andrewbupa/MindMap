# Model roles for local development without provider keys. Point AGORA_MODELS_FILE
# here to use Agora's deterministic development model. Never use in production.
roles:
  target:
    model: agoradev/scripted
    generate: { reasoning_effort: medium, max_tokens: 4000 }
  auditor:
    model: agoradev/scripted
  judge_a:
    model: agoradev/scripted
  # A second development "family", so the Lens panel rules hold locally too.
  judge_b:
    model: agorapeer/scripted
  scenarios:
    model: agoradev/scripted
panels:
  lens: [judge_a, judge_b]
budgets:
  playground: 400000
