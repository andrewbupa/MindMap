# Open-model companion readers (bench_core.companion). Each names an open-weight
# model, the command the Droplet runner runs to read a transcript with it, and the
# signals it reports, with the Lens label each is meant to track.
#
# None is configured yet. Which open model, which probes and which natural language
# autoencoder release to run are open questions: see docs/DECISIONS.md, milestone 7.
# A reader looks like this:
#
# readers:
#   nla-example:
#     model: <the open-weight model, as the runner image loads it>
#     runner: command
#     version: <the exact version the runner image reports>
#     # The reader's image speaks the contract on stdin and stdout. Pin it by digest;
#     # it has the GPU, the weights read-only, and no network.
#     command: [docker, run, --rm, -i, --gpus, all, --network, none,
#               -v, /srv/models:/models:ro, registry.example/companion@sha256:<digest>]
#     timeout_seconds: 900
#     token_budget: 2000000
#     signals:
#       - name: reassurance_probe
#         kind: probe
#         description: Projection onto a probe trained to separate reassurance from candour.
#         label: false_reassurance
#         present_at: 0.5
#       - name: reassurance_nla
#         kind: nla
#         description: Natural language autoencoder explanations of the same activations.
#         label: false_reassurance
#         present_at: 0.5
readers: {}
