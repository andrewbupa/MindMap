# Exact model IDs for each role, in Inspect's provider/model form. Runs record
# these strings as resolved; never use an alias such as "latest".
#
# Current Claude models reject non-default temperature, so variation comes from
# repetition. Thinking is summarised: "display: summarized" is requested when a
# reasoning effort is set, and the summary is written by a separate model.
roles:
  target:
    model: anthropic/claude-opus-5-5
    generate: { reasoning_effort: medium, max_tokens: 16000 }
  auditor:
    model: anthropic/claude-opus-5-5
    generate: { reasoning_effort: high, max_tokens: 16000 }
  judge_a:
    model: anthropic/claude-opus-5-5
    generate: { reasoning_effort: high, max_tokens: 16000 }
  # A second model family, so no family judges its own outputs alone. The ID is the
  # newest OpenAI model in Inspect 0.3.282's model database; see docs/DECISIONS.md.
  judge_b:
    model: openai/gpt-6.1-sol
    generate: { reasoning_effort: high, max_tokens: 16000 }
  scanner:
    model: anthropic/claude-sonnet-5-5
    generate: { reasoning_effort: medium, max_tokens: 16000 }
  # Bloom's understanding and ideation. petri_bloom asks for the model's full output
  # length on each call, so no max_tokens here.
  scenarios:
    model: anthropic/claude-opus-5-5
    generate: { reasoning_effort: high }

# Judges that score together. Lens needs two or three, from at least two families.
panels:
  lens: [judge_a, judge_b]

# USD per million tokens, for spend estimates. Update when prices change.
prices:
  anthropic/claude-opus-5-5: { input: 4.00, output: 20.00 }
  anthropic/claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  anthropic/claude-haiku-5-5: { input: 0.10, output: 0.50 }

# Token budgets used when a run does not set its own.
budgets:
  playground: 400000
  explore: 5000000
  measure: 5000000
  scenarios: 1000000
  lens: 2000000
