#cloud-config
# User data for the runner Droplet. Use DigitalOcean's AI/ML-ready GPU image, which
# ships the NVIDIA driver and Container Toolkit; this adds Docker, points Docker at
# the NVIDIA runtime and prepares the directories. Nothing secret belongs here: the
# environment file and the deploy key are added by hand (see README.md).
package_update: true
packages: [ca-certificates, curl, git]

write_files:
  - path: /etc/bench/README
    permissions: "0644"
    content: |
      runner.env holds Bench's runner settings and secrets. Mode 0600, owner root.
      See infra/runner/README.md in the repository.

runcmd:
  # Docker Engine from Docker's own repository, if the image does not have it.
  - |
    if ! command -v docker >/dev/null; then
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
    fi
  - nvidia-ctk runtime configure --runtime=docker
  - systemctl restart docker
  # The checkout, and model weights that companion images mount read-only.
  - install -d -m 0755 /srv/bench /srv/models
  - install -d -m 0700 /etc/bench
