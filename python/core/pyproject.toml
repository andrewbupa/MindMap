[project]
name = "bench-core"
version = "0.1.0"
description = "Bench core: database models, migrations, storage, configuration and shared logic"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary,pool]>=3.3",
  "alembic>=1.20",
  "pydantic>=2.12",
  "pydantic-settings>=2.16",
  "boto3>=1.43",
  "pyyaml>=6.0",
  "procrastinate>=3.10,<3.11",
  "inspect-ai==0.3.282",
  "inspect-petri==3.1.1",
  "inspect-scout==0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_core"]
