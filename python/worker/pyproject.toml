[project]
name = "agora-worker"
version = "0.1.0"
description = "Agora background worker: job runners for Explore, Measure and Lens"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agora-core",
]

[tool.uv.sources]
agora-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora_worker"]
