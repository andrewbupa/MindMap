[project]
name = "bench-worker"
version = "0.1.0"
description = "Bench background worker: job runners for Explore, Measure and Lens"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bench-core",
]

[tool.uv.sources]
bench-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_worker"]
