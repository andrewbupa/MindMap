[project]
name = "agora-api"
version = "0.1.0"
description = "Agora API service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agora-core",
  "fastapi>=0.156",
  "uvicorn[standard]>=0.54",
  "authlib>=1.9",
  "httpx2>=2.16",
  "itsdangerous>=2.2",
  "reportlab==5.0.1",
]

[tool.uv.sources]
agora-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora_api"]
